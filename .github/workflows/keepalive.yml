    - cron: "17 6 * * 1,4"   # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keepalive()
        run: |
          curl -fsS -X POST "https://xhgnyzojzpungdvvxkkt.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_xACqLQZ6R0xzE_rxbCoiIw_16FulOeD" \
            -H "Content-Type: application/json" -d '{}'
